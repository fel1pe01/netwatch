global:
  resolve_timeout: 5m
  # Telegram configuration (set via environment variables)
  # telegram_api_url: "https://api.telegram.org"
  # telegram_bot_token: "${TELEGRAM_BOT_TOKEN}"
  # telegram_chat_id: "${TELEGRAM_CHAT_ID}"

route:
  group_by: ['alertname', 'job', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 0s
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: 'warning-alerts'
      group_wait: 30s
      repeat_interval: 4h
    - match:
        alertname: NetwatchConfigChanged
      receiver: 'info-alerts'
      group_wait: 0s
      repeat_interval: 24h

receivers:
  - name: 'default'
    # Default receiver - can be configured for email, webhook, etc.
    # NOTE: /api/v1/alerts/webhook endpoint NOT IMPLEMENTED in netwatch yet
    webhook_configs:
      - url: 'http://netwatch:8080/api/v1/alerts/webhook'
        send_resolved: true

  - name: 'critical-alerts'
    # NOTE: /api/v1/alerts/webhook endpoint NOT IMPLEMENTED in netwatch yet
    webhook_configs:
      - url: 'http://netwatch:8080/api/v1/alerts/webhook'
        send_resolved: true
    # Telegram integration (uncomment and configure)
    # telegram_configs:
    #   - bot_token: "${TELEGRAM_BOT_TOKEN}"
    #     chat_id: "${TELEGRAM_CHAT_ID}"
    #     parse_mode: "HTML"
    #     message: |
    #       <b>🚨 CRITICAL: {{ .GroupLabels.alertname }}</b>
    #       {{ range .Alerts }}
    #       <b>Summary:</b> {{ .Annotations.summary }}
    #       <b>Description:</b> {{ .Annotations.description }}
    #       <b>Severity:</b> {{ .Labels.severity }}
    #       <b>Instance:</b> {{ .Labels.instance }}
    #       {{ end }}

  - name: 'warning-alerts'
    # NOTE: /api/v1/alerts/webhook endpoint NOT IMPLEMENTED in netwatch yet
    webhook_configs:
      - url: 'http://netwatch:8080/api/v1/alerts/webhook'
        send_resolved: true

  - name: 'info-alerts'
    # NOTE: /api/v1/alerts/webhook endpoint NOT IMPLEMENTED in netwatch yet
    webhook_configs:
      - url: 'http://netwatch:8080/api/v1/alerts/webhook'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']

  - source_match:
      alertname: 'NetwatchDown'
    target_match_re:
      alertname: 'Netwatch.*'
    equal: ['instance']

templates:
  - '/etc/alertmanager/template/*.tmpl'