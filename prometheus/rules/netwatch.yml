groups:
  - name: netwatch.rules
    interval: 30s
    rules:
      # Instance health
      - alert: NetwatchDown
        expr: up{job="netwatch"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Netwatch instance is down"
          description: "Netwatch has been down for more than 1 minute"

      # Scheduler health
      - alert: NetwatchSchedulerErrors
        expr: rate(netwatch_scheduler_errors_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Netwatch scheduler errors detected"
          description: "Scheduler error rate is {{ $value }} per second"

      # Health check failures
      - alert: NetwatchHighFailureRate
        expr: |
          sum(rate(netwatch_health_check_failures_total[5m])) by (protocol)
          /
          sum(rate(netwatch_health_checks_total[5m])) by (protocol)
          > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High health check failure rate for {{ $labels.protocol }}"
          description: "Failure rate for {{ $labels.protocol }} is above 10%"

      # Latency alerts
      - alert: NetwatchHighLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(netwatch_health_check_latency_seconds_bucket[5m])) by (le, protocol)
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency for {{ $labels.protocol }}"
          description: "p95 latency for {{ $labels.protocol }} is {{ $value }}s"

