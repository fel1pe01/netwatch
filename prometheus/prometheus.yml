global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'netwatch'
    environment: '${ENVIRONMENT:-production}'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - 'rules/*.yml'

scrape_configs:
  - job_name: 'netwatch'
    static_configs:
      - targets: ['netwatch:8080']
        labels:
          service: 'netwatch'
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']

  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9092', 'kafka-ui:8080']