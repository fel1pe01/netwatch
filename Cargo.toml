[package]
name = "netwatch"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core

tokio = { version = "1", features = ["full"] }
axum = "0.7"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
thiserror = "1"
# Database
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
# Metrics
prometheus = "0.13"
# Logging
tracing = "0.1"
tracing-subscriber = "0.3"
# Temp files
 tempfile = "3.5"
futures = "0.3"
# Health monitoring dependencies
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
once_cell = "1.17"
if-addrs = "0.9.0"

[dev-dependencies]
assert_cmd = "2.2.2"
futures = "0.3"
predicates = "3.1.4"
reqwest = { version = "0.13.5", features = ["json"] }
