[package]
name = "netwatch"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
# Core

tokio = { version = "1", features = ["full"] }
axum = "0.7"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10"
anyhow = "1"
thiserror = "1"
# Database
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
# Metrics
prometheus = "0.14"
# Logging
tracing = "0.1"
tracing-subscriber = "0.3"
# Temp files
tempfile = "3.5"
futures = "0.3"
# Health monitoring dependencies
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
once_cell = "1.17"
if-addrs = "0.9.0"
uuid = { version = "1", features = ["v4", "serde"] }
# Graph for topology
petgraph = "0.6"
# SNMP
async-snmp = "0.18"
async-trait = "0.1"
# HTTP client
reqwest = { version = "0.13", features = ["json", "rustls", "gzip"] }
# DNS resolution
hickory-resolver = { version = "0.26", features = ["tokio"] }
# TLS
rustls = "0.23"
tokio-rustls = "0.26"
rustls-native-certs = "0.8"
# Certificate parsing
x509-parser = "0.15"

[dev-dependencies]
assert_cmd = "2.2.2"
futures = "0.3"
predicates = "3.1.4"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.test]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
